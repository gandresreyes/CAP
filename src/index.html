<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>CAP Estudio</title>
    <base href="/" />
    <!-- viewport-fit=cover: la app ocupa también la zona del notch; los márgenes los ponen las clases con safe-area -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Estudia el CAP de Mercancías con preguntas de exámenes oficiales." />

    <!-- Color de la barra del navegador: el mismo que el fondo de la app, en claro y en oscuro -->
    <meta name="theme-color" content="#FAFAFA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />

    <!-- Iconos: pestaña del navegador y pantalla de inicio del iPhone (iOS no usa los del manifest) -->
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

    <!-- PWA: manifest (nombre, colores, iconos) para poder instalarla en el móvil -->
    <link rel="manifest" href="manifest.webmanifest" />

    <!-- iPhone: al abrirla desde la pantalla de inicio, sin barras de Safari y con este nombre -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CAP" />
  </head>
  <body>
    <app-root></app-root>
    <noscript>Activa JavaScript para usar esta aplicación.</noscript>
  </body>
</html>
