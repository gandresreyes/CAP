<!-- Contenido de la pestaña activa. `con-barra` deja hueco abajo para que la barra no lo tape. -->
<div class="con-barra">
  <router-outlet />
</div>

<!-- Barra inferior fija. `routerLinkActive` pinta en azul la pestaña actual
     y `ariaCurrentWhenActive` se lo indica al lector de pantalla. -->
<nav class="barra-inferior" aria-label="Principal">
  <div class="mx-auto flex max-w-md">
    <!-- Hoy. `exact: true` porque "/" coincidiría con cualquier ruta. -->
    <a
      routerLink="/"
      routerLinkActive="pestana-activa"
      [routerLinkActiveOptions]="{ exact: true }"
      ariaCurrentWhenActive="page"
      class="pestana"
    >
      <svg viewBox="0 0 24 24" class="size-6" aria-hidden="true">
        <path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z" />
      </svg>
      <span>Hoy</span>
    </a>
    <!-- Temas -->
    <a routerLink="/temas" routerLinkActive="pestana-activa" ariaCurrentWhenActive="page" class="pestana">
      <svg viewBox="0 0 24 24" class="size-6" aria-hidden="true">
        <rect x="3.5" y="3.5" width="7" height="7" rx="1.5" />
        <rect x="13.5" y="3.5" width="7" height="7" rx="1.5" />
        <rect x="3.5" y="13.5" width="7" height="7" rx="1.5" />
        <rect x="13.5" y="13.5" width="7" height="7" rx="1.5" />
      </svg>
      <span>Temas</span>
    </a>
    <!-- Progreso -->
    <a routerLink="/progreso" routerLinkActive="pestana-activa" ariaCurrentWhenActive="page" class="pestana">
      <svg viewBox="0 0 24 24" class="size-6" aria-hidden="true">
        <path d="M5 20V13M12 20V5M19 20v-9" />
      </svg>
      <span>Progreso</span>
    </a>
  </div>
</nav>
